<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Status | Shahjahanpur Spartans</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sparkle.css">
    <style>
        @media (max-width: 600px) {
            .player-status-page .hero {
                min-height: 100svh;
                justify-content: flex-start;
                padding: max(1.25rem, env(safe-area-inset-top)) 0.75rem max(1rem, env(safe-area-inset-bottom));
            }

            .player-status-page .hero-content {
                margin-bottom: 1rem;
            }

            .player-status-page .hero-content h1 {
                font-size: clamp(1.7rem, 7vw, 2.3rem);
            }

            .player-status-page .hero-subtitle {
                font-size: 1rem;
                line-height: 1.5;
            }

            .player-status-page .form-card {
                width: 100%;
                padding: 1.1rem;
                border-radius: 18px;
            }

            .player-status-page input,
            .player-status-page button {
                min-height: 48px;
                font-size: 16px;
            }

            #statusDisplay,
            #loginError {
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>

<body class="player-status-page">
    <div class="hero">
        <div class="hero-content">
            <h1>🏏 Check Your Status</h1>
            <p class="hero-subtitle">Enter your mobile number to check your registration status</p>
        </div>

        <div class="form-card card" style="max-width: 500px;">
            <h2 class="text-center mb-2">Player Login</h2>
            <p class="text-center mb-3" style="color: var(--text-muted);">Check if you've been approved</p>

            <form id="playerLoginForm">
                <div class="form-group">
                    <label for="mobileNumber">Mobile Number</label>
                    <input type="tel" id="mobileNumber" name="mobileNumber"
                        placeholder="Enter your 10-digit mobile number" pattern="[0-9]{10}" required>
                    <div id="loginError" class="error-message hidden">Mobile number not found!</div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Check Status
                </button>
            </form>

            <!-- Status Display (hidden initially) -->
            <div id="statusDisplay" class="hidden"></div>

            <div style="margin-top: 20px; text-align: center;">
                <a href="index.html" style="color: var(--primary); text-decoration: none;">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="sheets-api.js?v=20261023-returning3"></script>
    <script src="player-login.js?v=20261023-returning3"></script>
</body>

</html>
